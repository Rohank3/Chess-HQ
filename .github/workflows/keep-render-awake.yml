# Keep the Render backend awake.
#
# Render's Free and Starter web services spin down after 15 minutes without
# inbound traffic (HTTP requests or WebSocket messages). Pinging the health
# endpoint every 10 minutes keeps the service under that window, so users
# never hit the ~1 minute cold-start delay.
#
# IMPORTANT — GitHub throttles scheduled workflows. `schedule` events are
# queued and only run "when resources are available", which on a free plan
# commonly means 30-60+ minutes late (or skipped) instead of on time. If the
# pings land further apart than Render's 15-minute idle window, the service
# still spins down between pings and users hit the cold start this workflow
# exists to prevent. That is GitHub-side queueing, not a bug in the job —
# there is no repository-side fix.
#
# The reliable fix is an external uptime monitor, which pings on a real
# timer outside GitHub. Free options:
#   - UptimeRobot (https://uptimerobot.com): create a monitor with
#     Monitor Type = HTTPS, URL = https://chess-server-c1d3.onrender.com/api/health,
#     Interval = 5 minutes. It also alerts you if the site goes down.
#   - cron-job.org: same idea, 1-minute intervals on the free tier.
#
# If the service URL ever changes, override it with a repository secret
# (Settings -> Secrets and variables -> Actions -> New repository secret,
# name RENDER_HEALTH_URL, value https://<your-service>.onrender.com/api/health)
# rather than editing this file.
#
# The retry budget below is deliberately generous: Render free tier cold
# starts take ~60-90 seconds, and the first request into a sleeping instance
# can hang until then. max-time 90 + 6 retries (15s apart) covers that
# window, so the pings that DO run actually wake the service instead of
# failing against the cold-start queue.

name: Keep Render awake

on:
  schedule:
    # Every 10 minutes. Render's idle window is 15 minutes, so 10 gives a
    # comfortable margin even when GitHub's cron queue is a few minutes late.
    - cron: '*/10 * * * *'
  # Lets you fire a ping manually from the Actions tab (useful for testing
  # before the next scheduled run).
  workflow_dispatch:

jobs:
  ping:
    name: Ping Render /api/health
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: GET health endpoint
        env:
          HEALTH_URL: ${{ secrets.RENDER_HEALTH_URL || 'https://chess-server-c1d3.onrender.com/api/health' }}
        run: |
          curl -fsS \
            --max-time 90 \
            --retry 6 \
            --retry-delay 15 \
            --retry-all-errors \
            -o /dev/null \
            -w "health check: HTTP %{http_code}\n" \
            "$HEALTH_URL"
